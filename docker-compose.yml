# ─────────────────────────────────────────────────────────────
# Docker Compose – LLVM IR Fuzzing Pipeline
# Source: CONTEXT.json → architecture.infrastructure
#         CONTEXT.json → setup.run_steps
# ─────────────────────────────────────────────────────────────
version: "3.9"

services:
  # ── Ollama LLM backend ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── Backend: LLM Mutator & API ──────────────────────────────
  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:1.5b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-1500}
      - GROQ_REASONING_FORMAT=${GROQ_REASONING_FORMAT:-}
      - GROQ_MAX_RETRIES=${GROQ_MAX_RETRIES:-6}
      - GROQ_RETRY_BASE_SLEEP_S=${GROQ_RETRY_BASE_SLEEP_S:-1.0}
      - GROQ_RETRY_MAX_SLEEP_S=${GROQ_RETRY_MAX_SLEEP_S:-30.0}
      - SEED_DIR=/data/seeds
      - MUTANT_DIR=/data/mutants_llm
      - GRAMMAR_DIR=/data/mutants_grammar
      - RANDOM_DIR=/data/mutants_random
      - VALID_DIR=/data/valid_mutants
      - INVALID_DIR=/data/invalid_mutants
      - LOGS_DIR=/data/logs
    volumes:
      - ./backend/data/seeds:/data/seeds
      - ./backend/data/mutants_llm:/data/mutants_llm
      - ./backend/data/mutants_grammar:/data/mutants_grammar
      - ./backend/data/mutants_random:/data/mutants_random
      - ./backend/data/valid_mutants:/data/valid_mutants
      - ./backend/data/invalid_mutants:/data/invalid_mutants
      - ./backend/data/logs:/data/logs
    restart: unless-stopped

  # ── LLVM Tester: Validation & Differential Testing ──────────
  llvm-tester:
    build:
      context: ./backend/llvm-tester
      dockerfile: Dockerfile
    container_name: llvm-tester
    depends_on:
      - backend
    environment:
      - MUTANT_DIR=/data/mutants_llm
      - GRAMMAR_DIR=/data/mutants_grammar
      - RANDOM_DIR=/data/mutants_random
      - VALID_DIR=/data/valid_mutants
      - INVALID_DIR=/data/invalid_mutants
      - LOGS_DIR=/data/logs
    volumes:
      - ./backend/data/mutants_llm:/data/mutants_llm
      - ./backend/data/mutants_grammar:/data/mutants_grammar
      - ./backend/data/mutants_random:/data/mutants_random
      - ./backend/data/valid_mutants:/data/valid_mutants
      - ./backend/data/invalid_mutants:/data/invalid_mutants
      - ./backend/data/logs:/data/logs
    restart: on-failure

  # ── Frontend Dashboard ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: frontend
    ports:
      - "4000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
